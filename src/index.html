<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battleship</title>
    <link rel="shortcut icon" href="./visuals/ship-32.png" type="image/x-icon">
</head>
<body>
    <div class="intro">
        <h1>Battleship</h1>
        <p>Battle against the computer and see if you can beat it!</p>
        <button>Play</button>
    </div>
    <div class="boards-wrapper">
        <div class="y-labels">
            <p>1</p>
            <p>2</p>
            <p>3</p>
            <p>4</p>
            <p>5</p>
            <p>6</p>
            <p>7</p>
            <p>8</p>
            <p>9</p>
            <p>10</p>
        </div>
        <div class="board-wrapper">
            <div class="x-labels">
                <p>A</p><p>B</p><p>C</p><p>D</p><p>E</p><p>F</p><p>G</p><p>H</p><p>I</p><p>J</p>
            </div>
            <div class="board own-board"></div>
        </div>

        <div class="y-labels opponent">
            <p>1</p>
            <p>2</p>
            <p>3</p>
            <p>4</p>
            <p>5</p>
            <p>6</p>
            <p>7</p>
            <p>8</p>
            <p>9</p>
            <p>10</p>
        </div>
        <div class="board-wrapper">
            <div class="x-labels">
                <p>A</p><p>B</p><p>C</p><p>D</p><p>E</p><p>F</p><p>G</p><p>H</p><p>I</p><p>J</p>
            </div>
            <div class="board opponent-board"></div>
        </div>
    </div>
</body>
</html>
